defaults:
  - env/libero_10@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement: 
    env,rollout: 0-4

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_openpi_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    #task_id_filter: [0]      # ← 新增：只测 task 0（ID 从 0 数，libero_10 共 10 个任务）
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 520
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "" # https://huggingface.co/RLinf/RLinf-Pi05-LIBERO-SFT
    model_type: "openpi"
    num_action_chunks: 4
    # 夹爪约定（按模型指定）：pm1: -1=开(lerobot ±1) | openpi01: 0=开(openpi 转换权重) | rlinf01: 1=开(RLinf 自训权重)
    openpi_data:
      gripper_convention: "openpi01"
    openpi:
      noise_level: 0.3
