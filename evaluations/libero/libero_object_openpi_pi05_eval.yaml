defaults:
  - env/libero_object@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_object_openpi_pi05_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 280   #280
    max_steps_per_rollout_epoch: 280  #280
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  pipeline_stage_num: 1

  model:
    model_path: "/private/localforge_leases/pl_3edec340ec3c/RLinf/logs/20260922-20:37:51-libero_sft_openpi/openpi_0.5/checkpoints/global_step_100" # RLinf官方SFT
    model_type: "openpi"
    num_action_chunks: 4
    # 夹爪约定（按模型指定，映射到 LIBERO 环境 -1=开/+1=关）：
    #   pm1:      -1=开, +1=关（lerobot 原生 ±1 权重, 如 lerobot/pi05_libero_finetuned_v044）
    #   openpi01: 0=开, 1=关（openpi 转换权重, 如 pi05_libero_base / THU few-shot SFT）
    #   rlinf01:  1=开, 0=关（RLinf lerobot 格式数据训练的权重, 如自训 global_step_*）
    openpi_data:
      gripper_convention: "rlinf01"
    # openpi specific parameters
    openpi:
      noise_level: 1.0
