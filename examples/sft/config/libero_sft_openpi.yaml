defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # 用哪张卡由 run_vla_sft.sh 的 GPU_IDS 决定（通过环境变量 RLINF_GPU_RANKS 传进来）。
    # 填物理卡号：单卡 "3"，多张连续的卡 "0-3" 或 "0,1,2,3"；不设置时默认 0 号卡。
    actor,env,rollout: ${oc.env:RLINF_GPU_RANKS,0}

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "openpi_0.5"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: -1
  max_steps: 100
  val_check_interval: -1
  save_interval: 50

data:
  train_data_paths: "/private/RLinf/datasets/libero_object"
actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 7
  global_batch_size: 7   #128
  seed: 0

  # Override the default values in model/pi0_5
  model:
    precision: null
    model_path: "/private/ZR/models--lerobot--pi05_libero_base/snapshots/a217bfd3b14673cf2ce597e69997ab21866438dd"
    num_action_chunks: 4 # interface for the env
    add_value_head: False
    is_lora: True
    lora_rank: 32
    openpi:
      config_name: "pi05_libero"
      detach_critic_input: True

  optim:
    lr: 2.5e-5   
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08  
    weight_decay: 1.0e-10  
    clip_grad: 1.0
    lr_scheduler: "cosine"
    lr_warmup_steps: 10
    total_training_steps: 100  # for lr scheduler cosine decay
    num_cycles: 0.5
    min_lr: 2.5e-6

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}