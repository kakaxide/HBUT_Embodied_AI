model_type: "openpi"

# Model path - should be set in specific config files
model_path: "/path/to/model/openpi"

precision: null # for openpi, precision is null, please do not change this value

# Action and chunk settings
num_action_chunks: 10
action_dim: 7

# LoRA settings
is_lora: False
lora_rank: 32

# Training settings
use_proprio: True
num_steps: 5
add_value_head: False

# openpi specific parameters
openpi:
  config_name: "pi05_libero"
  num_images_in_input: 2
  noise_level: 0.5
  action_chunk: ${..num_action_chunks}
  num_steps: ${..num_steps}
  train_expert_only: True
  action_env_dim: ${..action_dim}
  noise_method: "flow_sde"
  add_value_head: ${..add_value_head}
  value_after_vlm: False
  value_vlm_mode: "mean_token"
  detach_critic_input: null

  # DSRL specific configurations (disabled by default)
  use_dsrl: False
  dsrl_state_dim: 8
  dsrl_action_noise_dim: 32
  dsrl_num_q_heads: 10
  dsrl_agg_q: "mean"
  dsrl_image_latent_dim: 64
  dsrl_state_latent_dim: 8
  dsrl_hidden_dims: [128, 128, 128]

# openpi data pipeline overrides (passed to get_openpi_config -> dataconfig)
openpi_data:
  # 夹爪约定（仅评测/推理时生效，按模型在 eval yaml 里覆盖）：
  #   pm1:      -1=开, +1=关（lerobot 原生 ±1 权重, 如 lerobot/pi05_libero_finetuned_v044），不映射
  #   openpi01: 0=开, 1=关（openpi 转换权重, 如 pi05_libero_base / THU few-shot SFT）
  #   rlinf01:  1=开, 0=关（RLinf lerobot 格式数据训练的权重）
  gripper_convention: "pm1"